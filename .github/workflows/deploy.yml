name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  migrate-aiven:
    name: Prisma migrate deploy (Aiven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations to Aiven
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set — skipping migrate."
            echo "Add repo secret DATABASE_URL (Aiven Service URI) to apply migrations from CI."
            exit 0
          fi
          npx prisma migrate deploy

  # App deploy: connect the GitHub repo in Vercel with Root Directory = backend.
  # Vercel builds via backend/vercel.json on each push to the production branch.
