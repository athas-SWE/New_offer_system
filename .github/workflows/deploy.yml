name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }} # e.g. offer-lanka-prod
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'offer-lanka-api' }}
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY || 'asia-south1-docker.pkg.dev' }}
  ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO || 'offer-lanka' }}

jobs:
  deploy-backend:
    name: Deploy backend to Cloud Run (stub)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ github.event.inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        # TODO: configure Workload Identity Federation or service account key secret
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        continue-on-error: true # stub — remove when secrets are configured

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        continue-on-error: true

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet
        continue-on-error: true

      - name: Build and push container image
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}"
          echo "Would build and push: $IMAGE"
          # docker build -t "$IMAGE" .
          # docker push "$IMAGE"
          # echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Deploy to Cloud Run
        run: |
          echo "Stub deploy to Cloud Run service: ${{ env.CLOUD_RUN_SERVICE }}"
          # gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
          #   --image "$IMAGE" \
          #   --region "${{ env.GCP_REGION }}" \
          #   --platform managed \
          #   --allow-unauthenticated \
          #   --set-env-vars "NODE_ENV=production,DB_HOST=${{ secrets.DB_HOST }}" \
          #   --quiet
        continue-on-error: true

  deploy-frontend:
    name: Deploy frontend to Firebase Hosting (stub)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.event.inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        continue-on-error: true

      - name: Build Angular app
        run: npm run build -- --configuration=production
        env:
          # TODO: inject production API URL / Firebase config via CI secrets or env files
          NG_APP_API_BASE_URL: ${{ vars.API_BASE_URL }}
        continue-on-error: true

      - name: Deploy to Firebase Hosting
        # TODO: add FIREBASE_TOKEN or use google-github-actions + firebase-tools
        run: |
          echo "Stub deploy to Firebase Hosting"
          # npm install -g firebase-tools
          # firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project "${{ vars.FIREBASE_PROJECT_ID }}"
        continue-on-error: true
