# Offer Lanka — local / shared Docker Compose
# Usage: docker compose up -d
# Apply schema: docker compose exec mysql mysql -u root -p"$MYSQL_ROOT_PASSWORD" < database/schema.sql
# Or: Get-Content database/schema.sql | docker compose exec -T mysql mysql -u root -p"$MYSQL_ROOT_PASSWORD" offer_lanka

services:
  mysql:
    image: mysql:8
    container_name: offer-lanka-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-offer_lanka}
      MYSQL_USER: ${MYSQL_USER:-offerlanka}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-offerlanka}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - offer-lanka-net

  redis:
    image: redis:7-alpine
    container_name: offer-lanka-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - offer-lanka-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: offer-lanka-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-offerlanka}
      DB_PASSWORD: ${MYSQL_PASSWORD:-offerlanka}
      DB_DATABASE: ${MYSQL_DATABASE:-offer_lanka}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-jwt-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    networks:
      - offer-lanka-net
    # Uncomment when a Dockerfile exists; otherwise run backend on host (npm run start:dev)
    profiles:
      - full

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: offer-lanka-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000/api}
    depends_on:
      - backend
    networks:
      - offer-lanka-net
    profiles:
      - full

volumes:
  mysql_data:
  redis_data:
  backend_uploads:

networks:
  offer-lanka-net:
    driver: bridge
